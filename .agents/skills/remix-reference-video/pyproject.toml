[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remix-reference-video"
version = "0.1.0"
description = "Gate-aware Fast Path contracts for reference video remix tasks"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
remixctl = "remix_reference_video.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
